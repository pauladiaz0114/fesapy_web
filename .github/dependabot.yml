# Dependabot: revisa cada semana si hay versiones nuevas y abre PRs agrupados.
# Las alertas de seguridad se activan aparte en GitHub (Settings → Advanced Security).
# Ver docs/ARQUITECTURA-Y-SEGURIDAD.md §7.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "America/Bogota"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    groups:
      # Parches y versiones menores juntos en un solo PR. Las mayores llegan una por una.
      npm-menores:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "America/Bogota"
    commit-message:
      prefix: "chore"
    groups:
      acciones:
        patterns: ["*"]
